<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .lines { fill:var(--grid-line); }
  .sq { fill:var(--cell); }
  .blk { fill:var(--block); }
  .word { fill:var(--word); }
  .hl { fill:var(--highlight); }
  .ring { fill:none; stroke:var(--on-highlight); stroke-width:var(--stroke-frame); }
  .sq, .blk, .word, .hl, .lines { rx:var(--radius-none); }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:120px; line-height:.92; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
